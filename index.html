<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estoque de Veículos</title>
    <meta name="description" content="Carros seminovos e usados com procedência. Fale com a gente pelo WhatsApp." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Estoque de Veículos" />
    <meta property="og:description" content="Carros seminovos e usados com procedência." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet" />
    <script>
      // Anti-flash: aplica o tema antes da primeira pintura. Sem isto o
      // portal pisca branco antes de virar escuro a cada carregamento.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          if (t === "dark") document.documentElement.classList.add("dark");

          // Cores da revenda vêm do banco, depois da primeira pintura.
          // Sem isto o site pinta com a cor de fallback e só então troca
          // para a cor da marca, na frente do visitante. O cache cobre a
          // volta; a marca "pendente" desliga as transições até a cor
          // real chegar, para a troca não virar animação.
          var marca = localStorage.getItem("marca-cores");
          if (marca) {
            var cores = JSON.parse(marca);
            for (var k in cores) document.documentElement.style.setProperty(k, cores[k]);
          } else {
            document.documentElement.setAttribute("data-marca", "pendente");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
